<!doctype html>
<html lang="en" data-theme="mira" data-mode="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/tollgate.png" />
    <title>Tollgate</title>
    <script>
      // Apply the saved theme before first paint so there's no flash.
      try {
        if (localStorage.getItem('tollgate.theme') === 'light') document.documentElement.dataset.mode = 'light'
      } catch (e) {}
      // The landing and auth pages (/welcome, /login, /setup, /invite) are always light: paint their base colour until they mount.
      if (/^\/(welcome|login|setup|invite\/)/.test(location.pathname)) document.documentElement.classList.add('landing-boot')
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
