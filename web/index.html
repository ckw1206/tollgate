<!doctype html>
<html lang="en" data-theme="mira" data-mode="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/tollgate-180.png" />
    <title>Tollgate</title>
    <script>
      // Apply the stored theme before first paint so there's no flash. Inlined
      // copy of resolveMode in src/theme.ts (this runs before the bundle loads).
      // The landing and auth pages are always dark: force dark on <html> for
      // them (the same regex as landing-boot) before resolveMode — otherwise a
      // light OS with no stored pick paints a light body/overscroll under the
      // dark shell. Nothing else sets data-mode on those routes.
      var landingBoot = /^\/(welcome|login|setup|invite\/)/.test(location.pathname)
      try {
        var t = localStorage.getItem('tollgate.theme')
        document.documentElement.dataset.mode = landingBoot
          ? 'dark'
          : t === 'light' || t === 'dark' ? t : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
      } catch (e) {}
      // Paint the landing/auth base colour until their shell mounts.
      if (landingBoot) document.documentElement.classList.add('landing-boot')
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
