name: ci

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md", "LICENSE"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tollgate
          POSTGRES_PASSWORD: tollgate
          POSTGRES_DB: tollgate
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 2s --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26' # latest patch, like the Dockerfile's golang:1.26
          check-latest: true
      - run: make web
      - run: npm test
        working-directory: web
      - run: go vet ./...
      - run: make test TESTFLAGS=-race

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26' # latest patch, like the Dockerfile's golang:1.26
          check-latest: true
      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - name: go mod tidy
        run: go mod tidy -diff
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      # Rules from CLAUDE.md.
      - name: Repo rules
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          fail=0
          # The replaced product's name, encoded so this check doesn't trip itself.
          banned=$(echo bGl0ZWxsbQ== | base64 -d)
          if git grep -nIi "$banned"; then echo "::error::name of the replaced product in files"; fail=1; fi
          if ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then BASE=; fi # first push / force-push
          if [ -n "$BASE" ] && { git log --format='%B' "$BASE..HEAD"; echo "$PR_TITLE"; } | grep -i "$banned"; then
            echo "::error::name of the replaced product in a commit message or PR title"; fail=1
          fi
          if git grep -n 'fetch(' -- web/src ':!web/src/api.ts'; then echo "::error::only api() in web/src/api.ts may call fetch"; fail=1; fi
          if [ -n "$BASE" ] && git diff --name-only --diff-filter=MDR "$BASE" HEAD -- core/db/migrations | grep .; then
            echo "::error::applied migrations must not be edited, renamed or deleted; add a new one"; fail=1
          fi
          exit $fail

  # release-please keeps one "chore(main): release x.y.z" PR open and updates it on every push to
  # main. Merging that PR tags the release; only then are binaries and the image built and published.
  # Version: feat bumps minor and fix bumps patch while < 1.0. To force a version, add a
  # "Release-As: x.y.z" footer to a commit.
  release:
    needs: [test, checks]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write # release-please labels its PR
      packages: write
    steps:
      - uses: googleapis/release-please-action@v5
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - if: steps.rp.outputs.release_created
        uses: actions/checkout@v7
      - if: steps.rp.outputs.release_created
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - if: steps.rp.outputs.release_created
        uses: actions/setup-go@v7
        with:
          go-version: '1.26' # latest patch, like the Dockerfile's golang:1.26
          check-latest: true
      - if: steps.rp.outputs.release_created
        run: make web

      - name: Build binaries
        if: steps.rp.outputs.release_created
        env:
          VERSION: ${{ steps.rp.outputs.tag_name }}
        run: |
          mkdir -p out
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${target%/*} arch=${target#*/}
            name="tollgate_${VERSION#v}_${os}_${arch}"
            mkdir -p "build/$name"
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -trimpath \
              -ldflags "-s -w -X main.version=$VERSION -X main.commit=$GITHUB_SHA" \
              -o "build/$name/tollgate" ./cmd/tollgate
            cp LICENSE README.md "build/$name/"
            tar -C build -czf "out/$name.tar.gz" "$name"
          done
          (cd out && sha256sum *.tar.gz > checksums.txt)

      - if: steps.rp.outputs.release_created
        uses: docker/setup-buildx-action@v4
      - if: steps.rp.outputs.release_created
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.rp.outputs.release_created
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.rp.outputs.tag_name }}
            COMMIT=${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.rp.outputs.tag_name }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload binaries
        if: steps.rp.outputs.release_created
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ steps.rp.outputs.tag_name }}" out/*
