version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule: { interval: weekly }
    # Major bumps arrive as their own PR: they need review and a migration, not a rubber stamp.
    groups: { go: { patterns: ["*"], update-types: ["minor", "patch"] } }
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly }
    groups: { npm: { patterns: ["*"], update-types: ["minor", "patch"] } }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
